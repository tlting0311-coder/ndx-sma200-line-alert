[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndx-sma200-line-alert"
version = "0.1.0"
description = "Nasdaq 100 SMA200 crossover LINE Messaging API alerts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "requests>=2.32,<3",
    "yfinance>=0.2.54,<1",
    "pandas>=2.2,<3",
    "google-cloud-firestore>=2.19,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[project.scripts]
ndx-signal = "ndx_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
